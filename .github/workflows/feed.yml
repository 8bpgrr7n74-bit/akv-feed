name: AKV Feed

on:
  schedule:
    - cron: "17 * * * *"   # stündlich
  workflow_dispatch: {}    # manuell auslösbar

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python akv_feed.py
      - name: Commit feed
        run: |
          git config user.name "akv-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.xml
          git diff --cached --quiet || git commit -m "Feed update"
          git push
